name: Build installers
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==10.4.0
      - run: python -m unittest discover -s tests -v
      - name: Build and test Windows installer
        shell: powershell
        run: ./windows/build.ps1
      - name: Install, switch theme, repair and uninstall on disposable runner
        shell: powershell
        run: ./windows/integration-test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/Aside-Clean-Logo-Windows-Setup.exe
          if-no-files-found: error
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app, test and package
        run: bash macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: dist/Aside-Clean-Logo-macOS.dmg
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-installer'
          path: dist
          merge-multiple: true
      - name: Compute checksums
        working-directory: dist
        run: sha256sum Aside-Clean-Logo-Windows-Setup.exe Aside-Clean-Logo-macOS.dmg > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Aside Clean Logo $GITHUB_REF_NAME" --notes-file docs/release-notes.md
