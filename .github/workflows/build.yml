name: Build Windows one-click tools
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow==10.4.0
      - run: npm ci --ignore-scripts
      - run: python tools/build-assets.py
      - run: python -m unittest discover -s tests -v
      - name: Build and test Windows installer
        shell: powershell
        run: ./windows/build.ps1
      - name: Install, switch theme, repair and uninstall on disposable runner
        shell: powershell
        run: ./windows/integration-test.ps1
      - name: One-click migration, apply, repeat apply and restore
        shell: powershell
        run: ./windows/integration-test.ps1 -OneClick
      - uses: actions/upload-artifact@v4
        with:
          name: windows-one-click
          path: |
            dist/Aside-Logo-Apply.exe
            dist/Aside-Logo-Restore.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-one-click
          path: dist
          merge-multiple: true
      - name: Compute checksums
        working-directory: dist
        run: sha256sum Aside-Logo-Apply.exe Aside-Logo-Restore.exe > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Aside Clean Logo $GITHUB_REF_NAME" --notes-file docs/release-notes.md
