name: Investigate actual Aside Dock icons
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Probe signed fixture and official Aside without modifying code
        run: bash macos/dock-probe.sh dist/dock-probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-aside-dock-evidence
          path: dist/dock-probe
          if-no-files-found: warn
